<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LM STUDIO Website Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Noto+Sans+Myanmar:wght@400;600&family=Noto+Sans+Thai:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap">
<style>
/* Layout: top action bar, left tab rail, centre form, right live preview. */
:root{
  --ink:#1a1917;--ink-2:#55514b;--muted:#8d877e;--bg:#f6f3ee;--card:#ffffff;--line:#e3ddd3;--gold:#cf9d95;--gold-soft:#f8e6e2;--ok:#2f7d4f;--warn:#b5651d;--bad:#b23a2a;
  --f:"Jost","Noto Sans Myanmar","Noto Sans Thai","Noto Sans SC",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.6}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100%}
.miss{background:#fde9e6;border-bottom:1px solid #f0c4bd;color:#7a2f25;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.miss b{font-weight:600}
.miss details{flex-basis:100%;font-size:12px}
.miss details code{display:inline-block;margin:2px 6px 0 0;background:#fff;padding:1px 6px;border-radius:4px}
img.broken{visibility:hidden}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--ink);color:#fff}
.top h1{font-size:15px;font-weight:600;letter-spacing:.08em;margin:0 12px 0 0;white-space:nowrap}
.top h1 small{font-weight:400;opacity:.6;letter-spacing:0;margin-left:6px}
.status{font-size:12px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.12)}
.status.dirty{background:#7a4b10}.status.saved{background:#245e3c}
.spacer{flex:1}
.b{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:6px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.b:hover{border-color:var(--ink)}
.b.gold{background:var(--gold);border-color:var(--gold);font-weight:600;color:#fff}
.b.dark{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.b.dark:hover{border-color:#fff}
.b.sm{padding:3px 9px;font-size:12px}
.b.danger{color:var(--bad)}
.b:disabled{opacity:.45;cursor:not-allowed}
.top select{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:6px 8px}
.top select option{color:var(--ink)}
.main{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,46%);min-height:0}
.main.nopv{grid-template-columns:200px minmax(0,1fr) 0}
.rail{border-right:1px solid var(--line);background:var(--card);padding:12px 8px;overflow-y:auto}
.rail button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:6px;margin-bottom:2px}
.rail button small{display:block;color:var(--muted);font-size:11px;line-height:1.2}
.rail button[aria-current="true"]{background:var(--gold-soft);font-weight:600}
.panel{overflow-y:auto;padding:20px clamp(16px,2.4vw,32px) 80px;min-width:0}
.panel h2{font-size:20px;margin:0 0 4px}
.panel .lead{color:var(--ink-2);margin:0 0 18px;max-width:70ch}
.group{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.group > h3{font-size:14px;margin:0 0 12px;letter-spacing:.04em}
.row{padding:10px 0;border-top:1px dashed var(--line)}
.row:first-of-type{border-top:0;padding-top:0}
.row > label,.lbl{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
.row > label code,.lbl code{font-weight:400;font-size:11px;color:var(--muted);margin-left:6px}
.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.lf{display:flex;flex-direction:column;gap:2px;min-width:0}
.lf span{font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.lf span.missing{color:var(--warn)}
input[type=text],input[type=date],input[type=number],input[type=url],input[type=email],textarea,select.inp{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:#fff;min-width:0}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus{border-color:var(--gold);outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 12px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.slot .th{aspect-ratio:4/3;background:#ece7df}
.slot .th img{width:100%;height:100%;object-fit:cover;display:block}
.slot .info{padding:10px;display:flex;flex-direction:column;gap:6px}
.slot .info b{font-size:13px}
.slot .info small{color:var(--muted);font-size:11.5px;line-height:1.4}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.ph{position:relative;border-radius:8px;overflow:hidden;border:2px solid transparent;background:#ece7df}
.ph.cover{border-color:var(--gold)}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.ph .tools{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:2px;padding:4px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.ph .tools button{border:0;background:rgba(255,255,255,.92);border-radius:4px;font-size:11px;padding:2px 6px}
.ph .badge{position:absolute;top:4px;left:4px;background:var(--gold);font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px}
.ph.add{display:grid;place-items:center;aspect-ratio:1;border:2px dashed var(--line);background:#fff;color:var(--ink-2);font-size:12.5px;text-align:center;padding:8px}
.ph.add:hover{border-color:var(--gold)}
.item-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.item-head .thumb{width:64px;height:48px;border-radius:6px;overflow:hidden;background:#ece7df;flex:none}
.item-head .thumb img{width:100%;height:100%;object-fit:cover}
.item-head b{flex:1;min-width:140px}
details.group > summary{cursor:pointer;list-style:none}
details.group > summary::-webkit-details-marker{display:none}
details.group[open] > summary{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.preview{border-left:1px solid var(--line);background:#ddd;min-width:0;display:flex;flex-direction:column}
.preview .pv-bar{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.preview iframe{flex:1;border:0;width:100%;background:#fff}
.main.nopv .preview{display:none}
.help ol{padding-left:20px}.help li{margin-bottom:10px}
.help .note{background:var(--gold-soft);border-radius:8px;padding:12px 14px;margin:12px 0}
.mapboard{position:relative;max-width:720px;background:#f3ece8;border:1px dashed var(--line);border-radius:10px;cursor:crosshair;user-select:none}
.mapboard img{width:100%;display:block;pointer-events:none}
.mapboard .mp{position:absolute;transform:translate(-50%,-100%);width:26px;height:32px;pointer-events:none}
.mapboard .mp b{position:absolute;inset:0 0 8px;display:grid;place-items:center;color:#fff;font-size:11px}
.mapboard .mp svg{width:26px;height:32px;fill:#a8706a}
.mapboard .mp.on svg{fill:#b9443e;transform:scale(1.25)}
.mapboard .mc{position:absolute;transform:translate(-50%,-50%);background:#fbf8f1;border:1px solid #c9b9a8;border-radius:6px;padding:2px 6px;font-size:10.5px;white-space:nowrap;pointer-events:none;z-index:2}
.mapboard .mc.on{background:#b9443e;color:#fff}
.mapboard .mp{z-index:3}
.mapboard svg.rt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mapboard svg.rt path{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:6 6;vector-effect:non-scaling-stroke}
.placepick{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.placepick button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 10px;font-size:12px}
.placepick button[aria-pressed="true"]{background:#b9443e;color:#fff;border-color:#b9443e}
.rail .badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:#b9443e;color:#fff;font-size:11px;margin-left:6px;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.tile b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:12px}
.tile.hot{border-color:#e6b3ad;background:#fdf1ef}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.recent div{border-radius:10px;overflow:hidden;background:#ece7df;aspect-ratio:4/5;position:relative}
.recent img,.recent video,.ph video{width:100%;height:100%;object-fit:cover;display:block}
.recent span{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:12px}
.ph video{aspect-ratio:1}
.ph .vtag{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:1px 6px;border-radius:4px}
.focus{position:relative;width:min(320px,100%);aspect-ratio:3/4;border-radius:10px;overflow:hidden;cursor:crosshair;background:#ece7df}
.focus img,.focus video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.focus i{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.4);pointer-events:none}
.inq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;border-left:5px solid #ccc}
.inq.s-new{border-left-color:#b9443e}.inq.s-contacted{border-left-color:#d79b3e}.inq.s-booked{border-left-color:#2f7d4f}.inq.s-done{border-left-color:#7a8a99}.inq.s-cancelled{border-left-color:#bbb;opacity:.75}
.inq h4{margin:0;font-size:17px}.inq .when{color:var(--muted);font-size:12px}
.inq .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:8px 0;color:var(--ink-2)}
.inq .msgx{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13.5px;white-space:pre-wrap;margin:6px 0}
.inq .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.inq .acts a{text-decoration:none}
.cloudbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:13px;margin-bottom:12px}
.dot{width:10px;height:10px;border-radius:50%;background:#bbb;display:inline-block}.dot.on{background:#2f7d4f}
textarea.sql{font:12px/1.5 ui-monospace,Consolas,monospace;min-height:220px;white-space:pre}
.ct{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.ct li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--bg);font-size:13px}
.ct li b{flex:none;width:22px;text-align:center}.ct li.ok b{color:#2f7d4f}.ct li.bad b{color:#b23a2a}.ct li.skip b{color:#999}
.ct li small{display:block;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9;max-width:90vw}
.toast.bad{background:var(--bad)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--bad)}
@media (max-width:1100px){.main{grid-template-columns:170px minmax(0,1fr)}.preview{display:none}#pvToggle{display:none}}
@media (max-width:640px){.main{grid-template-columns:1fr;grid-template-rows:auto 1fr}.rail{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}.rail button{width:auto;white-space:nowrap}.rail button small{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>LM STUDIO <small>Website Editor · ပြင်ဆင်ရန်</small></h1>
    <span class="status" id="status">ပြင်ဆင်မှု မရှိသေး</span>
    <span class="spacer"></span>
    <label style="font-size:12px;opacity:.8" for="pvLang">Preview ဘာသာ</label>
    <select id="pvLang"><option value="en">English</option><option value="shn">တႆး</option><option value="my">မြန်မာ</option><option value="zh">中文</option><option value="th">ไทย</option></select>
    <button class="b dark" id="pvToggle">Preview ပိတ်/ဖွင့်</button>
    <button class="b dark" id="connectBtn" title="Chrome / Edge only">Folder ချိတ်ရန်</button>
    <button class="b gold" id="saveBtn">သိမ်းရန် (Save)</button>
    <button class="b dark" id="dlBtn">content.js ဒေါင်းရန်</button>
  </div>
  <div class="miss" id="missBar" hidden>
    <span>⚠ <b id="missN">0</b> ပုံ ဒီ folder ရဲ့ <code>img/</code> ထဲမှာ မတွေ့ပါ — ပုံဟောင်းတွေက တခြား folder (ယခင် folder) ထဲမှာ ကျန်နေတာ ဖြစ်နိုင်ပါတယ်။</span>
    <button class="b sm" id="recoverBtn">ယခင် folder ကနေ ပုံတွေ ပြန်ယူရန်</button>
    <span id="fixWrap" hidden><button class="b sm gold" id="fixBtn">စာလုံး အကြီး/အသေး မကိုက်တဲ့ လမ်းကြောင်း <b id="fixN">0</b> ခု ပြင်ရန် (GitHub)</button></span>
    <button class="b sm" id="recheckBtn">ပြန်စစ်ရန်</button>
    <span id="dropMissWrap"><button class="b sm danger" id="dropMissAsk">မတွေ့တဲ့ပုံတွေကို စာရင်းကဖယ်ရန်</button></span>
    <details><summary>မတွေ့တဲ့ ဖိုင်စာရင်း</summary><div id="missList"></div></details>
  </div>
  <div class="main" id="main">
    <nav class="rail" id="rail"></nav>
    <section class="panel" id="panel"></section>
    <aside class="preview"><div class="pv-bar">Live preview · ပြင်တာ ချက်ချင်းမြင်ရ</div><iframe id="pv" src="index.html?preview=1" title="Website preview"></iframe></aside>
  </div>
</div>
<input type="file" id="filePick" accept="image/*" hidden>
<script type="text/plain" id="sqlSetup">-- LM STUDIO website · Supabase setup (run once in Supabase → SQL Editor → New query → Run)
-- 1) Website content (everything you edit in admin.html)
create table if not exists public.site_content (
  id int primary key,
  data jsonb not null,
  updated_at timestamptz default now()
);
alter table public.site_content enable row level security;
drop policy if exists "public read content" on public.site_content;
create policy "public read content" on public.site_content for select using (true);
drop policy if exists "admin write content" on public.site_content;
create policy "admin write content" on public.site_content for all to authenticated using (true) with check (true);

-- 2) Booking requests from the website
create table if not exists public.inquiries (
  id bigint generated always as identity primary key,
  created_at timestamptz default now(),
  name text not null check (char_length(name) between 1 and 120),
  phone text check (char_length(phone) <= 40),
  email text check (char_length(email) <= 120),
  shoot_date date,
  package text check (char_length(package) <= 200),
  place text check (char_length(place) <= 200),
  message text check (char_length(message) <= 2000),
  lang text check (char_length(lang) <= 8),
  status text not null default 'new',
  note text
);
alter table public.inquiries enable row level security;
drop policy if exists "anyone can send inquiry" on public.inquiries;
create policy "anyone can send inquiry" on public.inquiries for insert to anon, authenticated with check (status = 'new' and note is null);
drop policy if exists "admin reads inquiries" on public.inquiries;
create policy "admin reads inquiries" on public.inquiries for select to authenticated using (true);
drop policy if exists "admin updates inquiries" on public.inquiries;
create policy "admin updates inquiries" on public.inquiries for update to authenticated using (true) with check (true);
drop policy if exists "admin deletes inquiries" on public.inquiries;
create policy "admin deletes inquiries" on public.inquiries for delete to authenticated using (true);

-- 3) Photo & video storage (public bucket "media", 50 MB per file)
insert into storage.buckets (id, name, public, file_size_limit)
values ('media', 'media', true, 52428800)
on conflict (id) do update set public = true;
drop policy if exists "public read media" on storage.objects;
create policy "public read media" on storage.objects for select using (bucket_id = 'media');
drop policy if exists "admin upload media" on storage.objects;
create policy "admin upload media" on storage.objects for insert to authenticated with check (bucket_id = 'media');
drop policy if exists "admin update media" on storage.objects;
create policy "admin update media" on storage.objects for update to authenticated using (bucket_id = 'media');
drop policy if exists "admin delete media" on storage.objects;
create policy "admin delete media" on storage.objects for delete to authenticated using (bucket_id = 'media');

-- IMPORTANT: Authentication → Sign In / Providers → turn OFF "Allow new users to sign up",
-- then Authentication → Users → "Add user" to create ONLY your own admin login.
</script>

/* media picking (photos are resized; videos kept as files until Save) */
const BLOBS=new Map();
const isVid=s=>/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(String(s||""))||(String(s||"").startsWith("blob:")&&BLOBS.get(s)?.type?.startsWith("video"));
function thumb(src){return isVid(src)?`<video src="${esc(src)}#t=0.1" muted playsinline preload="metadata"></video><span class="vtag">VIDEO</span>`:`<img src="${esc(src)}" alt="" loading="lazy">`}
function pickMedia(multiple,maxSide=1800){return new Promise(res=>{const f=$("#filePick");f.accept="image/*,video/*";f.multiple=!!multiple;f.value="";
  f.onchange=async()=>{const out=[];for(const file of f.files){try{
      if(file.type.startsWith("video")){if(file.size>50*1048576){toast("ဗီဒီယို "+file.name+" က 50MB ထက်ကြီးနေပါတယ်။ သေးအောင် ချုံ့ပြီးမှ ထည့်ပါ။",1);continue}
        const u=URL.createObjectURL(file);BLOBS.set(u,file);out.push(u)}
      else out.push(await resize(file,maxSide))}catch(e){toast("ဖွင့်မရပါ: "+file.name,1)}}f.accept="image/*";res(out)};f.click()})}
/* image picking + resize */
function pickImages(multiple,maxSide=2000){return new Promise(res=>{const f=$("#filePick");f.multiple=!!multiple;f.value="";
  f.onchange=async()=>{const out=[];for(const file of f.files){try{out.push(await resize(file,maxSide))}catch(e){toast("ပုံဖွင့်မရပါ: "+file.name,1)}}res(out)};f.click()})}
function resize(file,maxSide){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const sc=Math.min(1,maxSide/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.86))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

function routeD(pts){if(pts.length<2)return"";let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}return d}

/* ---------- Supabase cloud (REST, no library) ---------- */
const cloudOK=()=>!!(SITE.cloud&&SITE.cloud.url&&SITE.cloud.key);
const base=()=>SITE.cloud.url.trim().replace(/\/+$/,"");
const sb={get s(){try{return JSON.parse(localStorage.getItem("lm_sb")||"null")}catch(e){return null}},set s(v){try{v?localStorage.setItem("lm_sb",JSON.stringify(v)):localStorage.removeItem("lm_sb")}catch(e){}},
  token(){return this.s&&this.s.access_token},email(){return this.s&&this.s.email||""}};
async function sbFetch(path,opt={}){if(!cloudOK())throw new Error("Cloud URL/Key မထည့်ရသေးပါ");
  const s=sb.s;if(s&&s.exp&&Date.now()>s.exp-60000)await sbRefresh();
  const h={apikey:SITE.cloud.key,...(sb.token()?{Authorization:"Bearer "+sb.token()}:{}),...(opt.headers||{})};
  const r=await fetch(base()+path,{...opt,headers:h});if(!r.ok){let m=r.status+"";try{const j=await r.json();m=j.message||j.error_description||j.msg||j.error||m}catch(e){}throw new Error(m)}return r}
async function sbLogin(email,pw){const r=await fetch(base()+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SITE.cloud.key,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});
  const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||j.error||"Login မရပါ");sb.s={access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+j.expires_in*1000,email:j.user?.email||email}}
async function sbRefresh(){const s=sb.s;if(!s)return;const r=await fetch(base()+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SITE.cloud.key,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.refresh_token})});
  const j=await r.json();if(!r.ok){sb.s=null;throw new Error("Login သက်တမ်းကုန်ပါပြီ။ ပြန်ဝင်ပါ။")}sb.s={...s,access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+j.expires_in*1000}}
async function cloudLoad(silent){try{const r=await sbFetch("/rest/v1/site_content?id=eq.1&select=data,updated_at");const j=await r.json();
  if(!j[0]){if(!silent)toast("Cloud မှာ အချက်အလက် မရှိသေးပါ။ 'Cloud သို့ တင်ရန်' ကို အရင်နှိပ်ပါ။");return}
  const keep=SITE.cloud;SITE=normalize(j[0].data);SITE.cloud=keep;dirty=false;render();sendPreview();if(!silent)toast("Cloud ကနေ ဖွင့်ပြီးပါပြီ ("+new Date(j[0].updated_at).toLocaleString()+")")}catch(e){if(!silent)toast("Cloud ဖွင့်မရပါ: "+e.message,1)}}
async function cloudUploadMedia(){const stamp=new Date().toISOString().replace(/[-:T]/g,"").slice(0,14);let n=0;const todo=[];
  const walk=o=>{for(const k in o){const v=o[k];if(typeof v==="string"&&(v.startsWith("data:image")||(v.startsWith("blob:")&&BLOBS.has(v))))todo.push(v);else if(v&&typeof v==="object")walk(v)}};walk(SITE);
  for(const v of [...new Set(todo)]){let blob,ext;if(v.startsWith("blob:")){blob=BLOBS.get(v);ext=(blob.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,"")}else{blob=await (await fetch(v)).blob();ext="jpg"}
    const path=`u/${stamp}-${++n}.${ext}`;toast(`ဖိုင် ${n}/${new Set(todo).size} တင်နေသည်…`);
    await sbFetch("/storage/v1/object/media/"+path,{method:"POST",headers:{"Content-Type":blob.type||"application/octet-stream","x-upsert":"true","cache-control":"31536000"},body:blob});
    replaceAll(SITE,v,base()+"/storage/v1/object/public/media/"+path)}return n}
async function cloudPublish(){const btn=$("#saveBtn");btn.disabled=true;btn.textContent="Cloud သို့ တင်နေသည်…";
  try{const n=await cloudUploadMedia();
    await sbFetch("/rest/v1/site_content",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify([{id:1,data:SITE,updated_at:new Date().toISOString()}])});
    dirty=false;const s=$("#status");s.textContent="Cloud သို့ တင်ပြီး "+new Date().toLocaleTimeString();s.className="status saved";toast("Website ကို Cloud ပေါ် တင်ပြီးပါပြီ"+(n?` · ဖိုင် ${n} ခု`:""));render();sendPreview()}
  catch(e){toast("Cloud သို့ တင်မရပါ: "+e.message,1)}btn.disabled=false;btn.textContent="သိမ်းရန် (Save)"}

function hint(m){m=String(m||"");
  if(/fetch|network|Failed/i.test(m))return "URL မှားနေနိုင်ပါတယ် (https://xxxx.supabase.co ပုံစံ ဖြစ်ရမယ်) သို့မဟုတ် အင်တာနက် မရပါ။";
  if(/does not exist|relation|schema cache|404|PGRST205/i.test(m))return "SQL ကို မ Run ရသေးပါ။ အဆင့် ၂ ကို လုပ်ပါ။";
  if(/Invalid API key|No API key|401/i.test(m))return "Key မှားနေပါတယ်။ Publishable (anon) key ကို ပြန်ကူးပါ။";
  if(/row-level security|violates|403|permission/i.test(m))return "ခွင့်ပြုချက် (Policy) မမှန်ပါ။ SQL ကို ပြန် Run ပါ။";
  if(/Bucket not found/i.test(m))return "Storage bucket 'media' မရှိပါ။ SQL ကို ပြန် Run ပါ။";
  if(/mime|size/i.test(m))return "Storage ဖိုင်အမျိုးအစား/အရွယ် ကန့်သတ်ချက် ပြဿနာ။";
  return m}
async function cloudTest(){const out=$("#ctOut");const R=[];const show=()=>out.innerHTML=`<ul class="ct">${R.map(r=>`<li class="${r.s}"><b>${r.s==="ok"?"✓":r.s==="bad"?"✗":"–"}</b><span>${esc(r.t)}${r.h?`<small>${esc(r.h)}</small>`:""}</span></li>`).join("")}</ul>`;
  const step=async(t,fn)=>{const r={t,s:"skip"};R.push(r);show();try{const h=await fn();r.s="ok";if(h)r.h=h}catch(e){r.s="bad";r.h=hint(e.message)+" ("+e.message+")"}show();return r.s==="ok"};
  const skip=(t,h)=>{R.push({t,s:"skip",h});show()};
  if(!await step("URL နဲ့ Key ပုံစံ",async()=>{if(!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)\/?$/i.test(SITE.cloud.url.trim())&&!/^https?:\/\//.test(SITE.cloud.url))throw new Error("URL format");if(!SITE.cloud.key||SITE.cloud.key.length<10)throw new Error("Key too short");if(/service_role|sb_secret_/.test(SITE.cloud.key))throw new Error("SECRET KEY! Publishable key ကိုပဲ သုံးပါ")}))return;
  await step("Website content ဖတ်ခြင်း (public)",async()=>{const r=await sbFetch("/rest/v1/site_content?id=eq.1&select=updated_at");const j=await r.json();return j[0]?"Cloud content ရှိပြီး · "+new Date(j[0].updated_at).toLocaleString():"Table ရှိပါတယ် (content မတင်ရသေး)"});
  const tok=sb.s;sb.s=null;let anonOK=false;
  try{anonOK=await step("ဖောက်သည်လို ဘွတ်ကင်စာ ပို့ခြင်း (anon)",async()=>{await sbFetch("/rest/v1/inquiries",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({name:"TEST · Cloud check (ဖျက်ရန်)",phone:"000000",message:"auto test",lang:"my"})})});
    await step("ဖောက်သည်က ဘွတ်ကင်စာများကို ဖတ်လို့ မရခြင်း (လုံခြုံရေး)",async()=>{const r=await sbFetch("/rest/v1/inquiries?select=id&limit=1");const j=await r.json();if(j.length)throw new Error("Public က ဘွတ်ကင်စာ ဖတ်လို့ရနေပါတယ် — permission");return"လုံခြုံပါတယ်"})}
  finally{sb.s=tok}
  if(!sb.token()){skip("Admin စစ်ဆေးမှုများ","Login ဝင်ပြီး ပြန်နှိပ်ပါ (Inbox, Storage, Publish ခွင့်)");return}
  await step("Admin Login သက်တမ်း",async()=>{await sbRefresh();return sb.email()});
  let testId=null;
  await step("Admin က ဘွတ်ကင်စာ ဖတ်ခြင်း",async()=>{const r=await sbFetch("/rest/v1/inquiries?select=id,name&order=created_at.desc&limit=20");const j=await r.json();const t=j.find(x=>/^TEST · Cloud check/.test(x.name));testId=t&&t.id;return `စာ ${j.length} စောင် တွေ့`});
  if(testId){await step("Status ပြောင်းခြင်း",async()=>{await sbFetch("/rest/v1/inquiries?id=eq."+testId,{method:"PATCH",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({status:"done"})})});
    await step("စမ်းသပ်စာ ပြန်ဖျက်ခြင်း",async()=>{await sbFetch("/rest/v1/inquiries?id=eq."+testId,{method:"DELETE"})})}
  const path="test/check-"+Date.now()+".png";
  const png=await (await fetch("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==")).blob();
  if(await step("ပုံ Upload (Storage)",async()=>{await sbFetch("/storage/v1/object/media/"+path,{method:"POST",headers:{"Content-Type":"image/png","x-upsert":"true"},body:png})})){
    await step("Upload ပုံကို public ကြည့်လို့ရခြင်း",async()=>{const r=await fetch(base()+"/storage/v1/object/public/media/"+path);if(!r.ok)throw new Error(r.status+" bucket not public")});
    await step("စမ်းသပ်ပုံ ပြန်ဖျက်ခြင်း",async()=>{await sbFetch("/storage/v1/object/media/"+path,{method:"DELETE"})})}
  await step("Website content ရေးခွင့် (Publish)",async()=>{await sbFetch("/rest/v1/site_content",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify([{id:999,data:{test:true}}])});await sbFetch("/rest/v1/site_content?id=eq.999",{method:"DELETE"})});
  const bad=R.filter(r=>r.s==="bad").length;toast(bad?`ပြဿနာ ${bad} ခု တွေ့ပါတယ်`:"Cloud အားလုံး အဆင်ပြေပါတယ် ✓",bad)}

  <textarea class="sql" readonly id="sqlBox">${esc($("#sqlSetup").textContent.trim())}</textarea><div style="margin-top:8px"><button class="b sm" data-copysql>SQL ကူးရန် (Copy)</button></div></div>
 <div class="group"><h3>၃။ Admin Login</h3>${!cl?'<p style="color:var(--muted)">အပေါ်မှာ URL နဲ့ Key အရင်ထည့်ပါ။</p>':sb.token()?`<div class="cloudbox"><span class="dot on"></span>ဝင်ထားသည်: <b>${esc(sb.email())}</b><button class="b sm" data-sblogout>ထွက်ရန် (Logout)</button></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="b gold" data-cloudpub>Cloud သို့ တင်ရန် (Publish)</button><button class="b" data-cloudload>Cloud ကနေ ဖွင့်ရန် (Load)</button></div>
   <p style="font-size:12px;color:var(--muted);margin:8px 0 0">Login ဝင်ထားစဉ် အပေါ်က <b>Save</b> ကိုနှိပ်ရင်လည်း Cloud ပေါ်ကို အလိုအလျောက် တင်ပါမယ်။</p>`:`<div class="grid2"><label class="lf"><span>Email</span><input type="email" id="sbEmail" autocomplete="username"></label><label class="lf"><span>Password</span><input type="password" id="sbPw" autocomplete="current-password"></label></div><div style="margin-top:10px"><button class="b gold" data-sblogin>Login ဝင်ရန်</button></div>
   <p style="font-size:12px;color:var(--muted);margin:8px 0 0">Supabase → Authentication → Users → <b>Add user</b> နဲ့ ကိုယ့် Admin account ကို ဖန်တီးထားပါ။ "Allow new users to sign up" ကို <b>ပိတ်</b>ထားပါ။</p>`}</div>`}
$("#rail").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b&&b.dataset.tab==="inquiries"&&cloudOK()&&sb.token())loadInq(true)});
$("#panel").addEventListener("click",async e=>{
  const go=e.target.closest("[data-go]");if(go){tab=go.dataset.go;render();$("#panel").scrollTop=0;if(tab==="inquiries"&&sb.token())loadInq(true);return}
  if(e.target.closest("[data-copysql]")){const t=$("#sqlBox");try{await navigator.clipboard.writeText(t.value);toast("ကူးပြီးပါပြီ")}catch(_){t.select();toast("Ctrl+C နှိပ်ပြီး ကူးပါ")}return}
  if(e.target.closest("[data-sblogin]")){try{await sbLogin($("#sbEmail").value.trim(),$("#sbPw").value);toast("Login ဝင်ပြီးပါပြီ");render();loadInq(true)}catch(err){toast(err.message,1)}return}
  if(e.target.closest("[data-sblogout]")){sb.s=null;INQ=[];inqLoaded=false;render();toast("ထွက်ပြီးပါပြီ");return}
  if(e.target.closest("[data-cloudpub]")){await cloudPublish();return}
  if(e.target.closest("[data-cloudtest]")){await cloudTest();return}
  if(e.target.closest("[data-cloudload]")){await cloudLoad(false);return}
  const f=e.target.closest("[data-inqf]");if(f){inqFilter=f.dataset.inqf;render();return}
  if(e.target.closest("[data-inqreload]")){await loadInq(false);return}
});
$("#panel").addEventListener("change",async e=>{const st=e.target.dataset.inqstatus,nt=e.target.dataset.inqnote;if(!st&&!nt)return;
  const id=st||nt,body=st?{status:e.target.value}:{note:e.target.value};
  try{await sbFetch("/rest/v1/inquiries?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(body)});const x=INQ.find(q=>String(q.id)===String(id));Object.assign(x,body);toast("သိမ်းပြီး");renderRail();if(st)render()}catch(err){toast("သိမ်းမရပါ: "+err.message,1)}});

 <li><b>index.html ကို ဖွင့်ကြည့်ပါ</b> (ဖွင့်ထားပြီးသားဆိုရင် Refresh လုပ်ပါ)။</li>
 <li><b>Hosting ပေါ်တင်မယ်ဆိုရင်</b> folder တစ်ခုလုံးကို (admin.html မပါလည်းရ) upload တင်ပါ။</li>
 </ol>
 <h3>Folder ချိတ်လို့ မရရင် (Firefox / Safari / ဖုန်း)</h3>

 <h3>Cloud (ဘယ်နေရာကမဆို ပြင်ရန်)</h3><ol><li>supabase.com မှာ အခမဲ့ Project တစ်ခု ဖွင့်ပါ။</li><li>"Cloud / အွန်လိုင်း" tab အတိုင်း URL/Key ထည့်၊ SQL Run၊ Admin user ဖန်တီးပါ။</li><li>Login ဝင်ပြီး Publish နှိပ်ပါ။ ပြီးရင် website ကို hosting ပေါ် တင်ထားတဲ့ <code>admin.html</code> ကို ဖုန်းကနေ ဖွင့်ပြီး ပြင်လို့ရပါပြီ။</li></ol>
 <h3>အမြန် မှတ်စုများ</h3>
 <ul><li>Gallery ပုံ: ◀ ▶ နဲ့ အစဉ်ပြောင်း၊ ★ နဲ့ cover လုပ်၊ ✕ နဲ့ဖျက်။</li><li>Social link ဗလာ = icon ဖျောက်။</li><li>GitHub Pages: ပုံနာမည် စာလုံးအကြီး/အသေး တိကျရပါတယ် (Photo.JPG ≠ photo.jpg)။ Folder ချိတ်ရင် Editor က အလိုအလျောက် စစ်ပြီး ပြင်ပေးပါမယ်။</li><li>Email စာရင်းသွင်းသူတွေကို Netlify → Forms → newsletter မှာ ကြည့်ပါ (website ကို Netlify ပေါ်တင်ထားမှ အလုပ်လုပ်)။</li><li>ဘာသာတစ်ခု ဗလာ = တႆး → မြန်မာ → English အစဉ်နဲ့ အစားထိုးပြ။</li><li>ဆောင်းပါး ရက်စွဲ အသစ်ဆုံး ၄ ပုဒ်ကို ပင်မစာမျက်နှာမှာ ပြ။</li><li>ပက်ကေ့ချ်: "ပက်ကေ့ချ် / ဈေးနှုန်း" tab မှာ ပုံ၊ အမည်၊ ဈေးနှုန်း၊ ပါဝင်သည့်အရာ နဲ့ နောက်ခံပုံ opacity ကို ပြင်ပါ။</li></ul>
 </div>`}

    case"delPost":SITE.posts.splice(i,1);pending.delete("post"+i);openSet.clear();break;
    case"addStat":SITE.stats.push({value:"10+",icon:"cam",label:per()});break;
    case"pkUp":mv(SITE.packages.items,i,i-1);openSet.clear();break;
    case"pkDown":mv(SITE.packages.items,i,i+1);openSet.clear();break;
    case"delPk":SITE.packages.items.splice(i,1);pending.delete("pk"+i);openSet.clear();break;
    case"addPk":SITE.packages.items.push({img:"",price:"",name:{...per(),en:"New Package",my:"ပက်ကေ့ချ် အသစ်"},features:per()});openSet.add("k"+(SITE.packages.items.length-1));break;
    case"pkBgClear":SITE.packages.bg="";break;
    case"plUp":mv(SITE.places.items,i,i-1);openSet.clear();break;
    case"plDown":mv(SITE.places.items,i,i+1);openSet.clear();break;
    case"delPl":SITE.places.items.splice(i,1);pending.delete("pl"+i);openSet.clear();plActive=0;break;
    case"addPl":SITE.places.items.push({x:50,y:50,cx:50,cy:15,img:"",lat:"",lng:"",name:{...per(),en:"New place",my:"နေရာ အသစ်"},sub:per(),desc:per(),meta:per()});plActive=SITE.places.items.length-1;openSet.add("l"+plActive);break;
    case"delInq":{try{await sbFetch("/rest/v1/inquiries?id=eq."+encodeURIComponent(a.dataset.i),{method:"DELETE"});INQ=INQ.filter(q=>String(q.id)!==String(a.dataset.i));pending.delete("inq"+a.dataset.i);toast("ဖျက်ပြီး")}catch(err){toast("ဖျက်မရပါ: "+err.message,1)}render();renderRail();return}
    case"delStat":SITE.stats.splice(i,1);pending.delete("stat"+i);break;
  }
  markDirty();render()});

/* ---------- save ---------- */
const serialize=()=>"/* LM STUDIO website content. Edit with admin.html (recommended). */\nwindow.SITE = "+JSON.stringify(SITE,null,1)+";\n";
function parseContent(txt){const a=txt.indexOf("{"),b=txt.lastIndexOf("}");return JSON.parse(txt.slice(a,b+1))}
$("#connectBtn").addEventListener("click",async()=>{
  if(!window.showDirectoryPicker){toast("ဒီ browser မှာ Folder ချိတ်လို့ မရပါ။ Chrome/Edge သုံးပါ သို့မဟုတ် 'content.js ဒေါင်းရန်' ကို သုံးပါ။",1);return}
  try{const h=await window.showDirectoryPicker({mode:"readwrite"});
    let txt;try{txt=await (await (await h.getFileHandle("content.js")).getFile()).text()}catch(e){toast("ဒီ folder ထဲမှာ content.js မရှိပါ။ Website folder ကို ရွေးပါ။",1);return}
    dirHandle=h;if(!dirty){try{SITE=normalize(parseContent(txt));render();sendPreview()}catch(e){}}
    $("#connectBtn").textContent="Folder: "+h.name;checkMissing();toast("Folder ချိတ်ပြီးပါပြီ။ Save နှိပ်ရင် ဒီ folder ထဲ တိုက်ရိုက်သိမ်းပါမယ်။")
  }catch(e){if(e.name!=="AbortError")toast("Folder ချိတ်မရပါ: "+e.message,1)}});
async function dataUrlToBlob(u){return await (await fetch(u)).blob()}
$("#saveBtn").addEventListener("click",async()=>{
  if(sb.token()){await cloudPublish();if(!dirHandle)return}
  if(!dirHandle){if(window.showDirectoryPicker){toast("ပထမဆုံး 'Folder ချိတ်ရန်' ကိုနှိပ်ပါ။ (သို့မဟုတ် content.js ဒေါင်းရန် ကို သုံးပါ)",1)}else downloadContent();return}
  const btn=$("#saveBtn");btn.disabled=true;btn.textContent="သိမ်းနေသည်…";
  try{
    const imgDir=await dirHandle.getDirectoryHandle("img",{create:true});
    const stamp=new Date().toISOString().replace(/[-:T]/g,"").slice(0,14);let n=0;
    const walk=async(o)=>{for(const k in o){const v=o[k];
      if(typeof v==="string"&&v.startsWith("blob:")&&BLOBS.has(v)){const file=BLOBS.get(v);const ext=(file.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,"");const name=`v-${stamp}-${++n}.${ext}`;const fh=await imgDir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(file);await w.close();replaceAll(SITE,v,"img/"+name)}
      else if(typeof v==="string"&&v.startsWith("data:image")){const name=`u-${stamp}-${++n}.jpg`;const fh=await imgDir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(await dataUrlToBlob(v));await w.close();
        const path="img/"+name;replaceAll(SITE,v,path)}
      else if(v&&typeof v==="object")await walk(v)}};
    await walk(SITE);
    // backup old content.js
    try{const old=await (await (await dirHandle.getFileHandle("content.js")).getFile()).text();const bd=await dirHandle.getDirectoryHandle("backups",{create:true});const bf=await bd.getFileHandle(`content-${stamp}.js`,{create:true});const bw=await bf.createWritable();await bw.write(old);await bw.close()}catch(e){}
    const fh=await dirHandle.getFileHandle("content.js",{create:true});const w=await fh.createWritable();await w.write(serialize());await w.close();
    dirty=false;const s=$("#status");s.textContent="သိမ်းပြီးပါပြီ "+new Date().toLocaleTimeString();s.className="status saved";
    toast("သိမ်းပြီးပါပြီ"+(n?` · ပုံအသစ် ${n} ပုံ img/ ထဲ ထည့်ပြီး`:""));render();sendPreview();
  }catch(e){toast("သိမ်းမရပါ: "+e.message,1)}
  btn.disabled=false;btn.textContent="သိမ်းရန် (Save)"});
function replaceAll(o,from,to){for(const k in o){if(o[k]===from)o[k]=to;else if(o[k]&&typeof o[k]==="object")replaceAll(o[k],from,to)}}
function downloadContent(){if(JSON.stringify(SITE).includes('"blob:')){toast("ဗီဒီယိုတွေကို content.js ထဲ ထည့်လို့မရပါ။ 'Folder ချိတ်ရန်' (သို့) Cloud ကို သုံးပြီး Save လုပ်ပါ။",1);return}const blob=new Blob([serialize()],{type:"text/javascript"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="content.js";document.body.appendChild(a);a.click();a.remove();
  const mb=(blob.size/1048576).toFixed(1);toast(`content.js (${mb} MB) ဒေါင်းပြီးပါပြီ။ Website folder ထဲက content.js ကို အစားထိုးပါ။`);dirty=false;const s=$("#status");s.textContent="ဒေါင်းပြီး";s.className="status saved"}
$("#dlBtn").addEventListener("click",downloadContent);
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});

/* ---------- missing-image check & recovery ---------- */
document.addEventListener("error",e=>{if(e.target.tagName==="IMG")e.target.classList.add("broken")},true);
function allImagePaths(){const out=new Set();const walk=o=>{for(const k in o){const v=o[k];if(typeof v==="string"&&/^img\/[^/]+$/i.test(v))out.add(v);else if(v&&typeof v==="object")walk(v)}};walk(SITE);return [...out]}
function probe(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(true);i.onerror=()=>r(false);i.src=src+"?t="+Date.now()})}
let missing=[],fixes=[];
async function checkMissing(){
  const paths=allImagePaths();const res=[];fixes=[];
  if(dirHandle){let img=null;try{img=await dirHandle.getDirectoryHandle("img")}catch(e){}
    const names=new Map();if(img){for await(const [n,h] of img.entries()){if(h.kind==="file")names.set(n.toLowerCase(),n)}}
    fixes=[];for(const p of paths){const n=p.slice(4);if(names.has(n.toLowerCase())&&names.get(n.toLowerCase())===n)continue;
      const real=names.get(n.toLowerCase())||names.get(decodeURIComponent(n).toLowerCase());if(real)fixes.push([p,"img/"+real]);else res.push(p)}}
  else{for(const p of paths){if(!(await probe(p)))res.push(p)}}
  missing=res;$("#missBar").hidden=!res.length&&!fixes.length;$("#fixWrap").hidden=!fixes.length;$("#fixN").textContent=fixes.length;$("#missN").textContent=res.length;
  $("#missList").innerHTML=res.map(x=>`<code>${esc(x)}</code>`).join("");
  $("#dropMissWrap").innerHTML='<button class="b sm danger" id="dropMissAsk">မတွေ့တဲ့ပုံတွေကို စာရင်းကဖယ်ရန်</button>';
  return res}
$("#fixBtn").addEventListener("click",async()=>{const n=fixes.length;fixes.forEach(([a,b])=>replaceAll(SITE,a,b));markDirty();await checkMissing();render();toast(`လမ်းကြောင်း ${n} ခု ပြင်ပြီး · Save နှိပ်ပါ`)});
$("#recheckBtn").addEventListener("click",async()=>{const r=await checkMissing();toast(r.length?`ပုံ ${r.length} ပုံ မတွေ့သေးပါ`:"ပုံအားလုံး တွေ့ပါပြီ ✓");render();sendPreview();reloadPreview()});
function reloadPreview(){try{$("#pv").contentWindow.location.reload()}catch(e){}}
$("#recoverBtn").addEventListener("click",async()=>{
  if(!window.showDirectoryPicker){toast("Chrome / Edge လိုပါတယ်",1);return}
  if(!dirHandle){toast("ပထမဆုံး 'Folder ချိတ်ရန်' နဲ့ လက်ရှိ website folder ကို ချိတ်ပါ",1);return}
  toast("ပုံဟောင်းတွေရှိတဲ့ ယခင် website folder (သို့) အဲ့ဒီ img folder ကို ရွေးပါ");
  let src;try{src=await window.showDirectoryPicker({mode:"read"})}catch(e){return}
  let srcImg=src;try{srcImg=await src.getDirectoryHandle("img")}catch(e){}
  const dst=await dirHandle.getDirectoryHandle("img",{create:true});let n=0,miss=0;
  for(const p of missing){const name=p.slice(4);try{const f=await (await srcImg.getFileHandle(name)).getFile();const w=await (await dst.getFileHandle(name,{create:true})).createWritable();await w.write(f);await w.close();n++}catch(e){miss++}}
  await checkMissing();render();reloadPreview();
  toast(`ပုံ ${n} ပုံ ပြန်ယူပြီးပါပြီ`+(miss?` · ${miss} ပုံ အဲ့ဒီ folder မှာလည်း မရှိပါ`:""),miss&&!n)});
document.addEventListener("click",e=>{
  if(e.target.id==="dropMissAsk"){$("#dropMissWrap").innerHTML='<span class="confirm">သေချာလား? <button class="b sm danger" id="dropMissDo">ဖယ်မည်</button><button class="b sm" id="dropMissNo">မဖယ်ပါ</button></span>'}
  if(e.target.id==="dropMissNo")checkMissing();
  if(e.target.id==="dropMissDo"){const M=new Set(missing);
    const clean=o=>{for(const k in o){const v=o[k];if(Array.isArray(v)){for(let i=v.length-1;i>=0;i--){if(typeof v[i]==="string"&&M.has(v[i]))v.splice(i,1);else if(v[i]&&typeof v[i]==="object")clean(v[i])}}
      else if(typeof v==="string"&&M.has(v))o[k]="";else if(v&&typeof v==="object")clean(v)}};
    clean(SITE);(SITE.categories||[]).forEach(c=>{if(!c.cover)c.cover=c.photos[0]||""});
    markDirty();checkMissing();render();toast("ဖယ်ပြီးပါပြီ။ Save နှိပ်ပြီး သိမ်းပါ")}
});
if(!window.SITE){$("#panel").innerHTML='<div class="group"><b>content.js ကို ရှာမတွေ့ပါ။</b> admin.html ကို website folder ထဲကနေ ဖွင့်ပါ။</div>'}else{render();setTimeout(checkMissing,400);if(cloudOK()){cloudLoad(true).then(()=>{if(sb.token())loadInq(true)})}}
</script>
</body>
</html>
